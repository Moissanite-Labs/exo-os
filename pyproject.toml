[project]
name = "exo-os"
version = "0.1.0"
description = "Exo OS: the Linux layer that makes Exo the heart of a machine"
requires-python = ">=3.11"
license = "MIT"
# Exo itself is pinned by commit in exo.pin and installed by tools/dev-env.sh (it has no releases yet).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exo-os = "exo_os.cli:main"
exo-sysd = "exo_os.sysd.server:main"
exo-os-setup = "exo_os.setup:main"
exo-surface = "exo_os.surface.app:main"

[project.entry-points."exo.plugins"]
exo-os = "exo_os.plugin:register"

[project.entry-points."exo.executors"]
exo-os = "exo_os.sandbox.executor:create_executor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exo_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
