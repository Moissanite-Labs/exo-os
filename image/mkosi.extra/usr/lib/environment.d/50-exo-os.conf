# The image has one person, exo. environment.d does not see USER, so the values are fixed, as in as-exo.
EXO_HOME=/var/lib/exo/exo
EXO_PLUGIN_DIRS=/opt/exo/plugins
EXO_PRINCIPAL=exo
EXO_TOOL_EXECUTOR=exo-os
EXO_TOOL_EXECUTOR_REQUIRED=1
EXO_LEDGER_AUTHORITY=exo-os
EXO_LEDGER_AUTHORITY_REQUIRED=1
EXO_MODEL_SPEND_REQUIRED=1
EXO_MODEL_SPEND_POLICY=/var/lib/exo/model-spend/policy.json
