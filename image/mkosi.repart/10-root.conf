# btrfs root in the layout snapper and Omarchy use: @ is the system, @home and @store are kept out of
# system rollbacks, @snapshots holds snapper's snapshots of @.
[Partition]
Type=root
Format=btrfs
CopyFiles=/:/@
CopyFiles=/home:/@home
CopyFiles=/var/lib/exo:/@store
ExcludeFiles=/boot/
ExcludeFiles=/efi/
ExcludeFilesTarget=/@/home/ /@/var/lib/exo/
MakeDirectories=/@ /@home /@snapshots /@store
Subvolumes=/@ /@home /@snapshots /@store
DefaultSubvolume=/@
SizeMinBytes=8G
