# btrfs root in the layout snapper and Omarchy use: @ is the system, @home and @store are kept out of
# system rollbacks; @sysd and @egress preserve service identity/audit and request history.
# @snapshots holds snapshots of @.
[Partition]
Type=root
Format=btrfs
CopyFiles=/:/@
CopyFiles=/home:/@home
CopyFiles=/var/lib/exo:/@store
CopyFiles=/var/lib/exo-sysd:/@sysd
CopyFiles=/var/lib/exo-egress:/@egress
ExcludeFiles=/boot/
ExcludeFiles=/efi/
ExcludeFilesTarget=/@/home/ /@/var/lib/exo/ /@/var/lib/exo-sysd/ /@/var/lib/exo-egress/
MakeDirectories=/@ /@home /@snapshots /@store /@sysd /@egress
Subvolumes=/@ /@home /@snapshots /@store /@sysd /@egress
DefaultSubvolume=/@
SizeMinBytes=8G
