# btrfs root in the layout snapper and Omarchy use: @ is the system, @home and @store are kept out of
# system rollbacks; @sysd keeps helper identity/audit current; @snapshots holds snapshots of @.
[Partition]
Type=root
Format=btrfs
CopyFiles=/:/@
CopyFiles=/home:/@home
CopyFiles=/var/lib/exo:/@store
CopyFiles=/var/lib/exo-sysd:/@sysd
ExcludeFiles=/boot/
ExcludeFiles=/efi/
ExcludeFilesTarget=/@/home/ /@/var/lib/exo/ /@/var/lib/exo-sysd/
MakeDirectories=/@ /@home /@snapshots /@store /@sysd
Subvolumes=/@ /@home /@snapshots /@store /@sysd
DefaultSubvolume=/@
SizeMinBytes=8G
