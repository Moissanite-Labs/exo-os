# Exo OS image, phase 1: Arch base, btrfs root with subvolumes, systemd-boot, Hyprland, Chromium,
# and Exo installed at a pinned commit with exod as a systemd user service.
# Build: tools/build-image.sh   Boot: tools/run-vm.sh

[Distribution]
Distribution=arch
Release=rolling
Architecture=x86-64

[Output]
ImageId=exo-os
Format=disk
CompressOutput=no

[Build]
ToolsTree=
WithNetwork=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
KernelCommandLine=rw quiet loglevel=3 rootflags=subvol=@
Hostname=exo
Locale=en_US.UTF-8
Timezone=America/Chicago
Keymap=us
RootPassword=hashed:!
Packages=
        base
        linux
        systemd
        btrfs-progs
        snapper
        snap-pac
        networkmanager
        openssh
        python
        python-pip
        bubblewrap
        libseccomp
        git
        less
        nano
        # desktop
        greetd
        hyprland
        hypridle
        hyprlock
        xdg-desktop-portal-hyprland
        foot
        chromium
        brightnessctl
        grim
        mesa
        pipewire
        pipewire-pulse
        wireplumber
        polkit
        noto-fonts
        noto-fonts-emoji
        # the prompt bar
        python-gobject
        gtk4
        gtk4-layer-shell
